name: Sonde des sources

# Lancé à la main uniquement : vérifie les sources de la v3 (catalogue Steam, IsThereAnyDeal)
# et enregistre des échantillons de réponses dans data/raw/probe/ (sans la clé).
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sonder les sources
        env:
          DEALHUNTER_CONTACT: ${{ secrets.DEALHUNTER_CONTACT }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
        run: python src/ingestion/probe_sources.py
      - name: Committer les échantillons
        run: |
          git config user.name  "dealhunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/probe
          git diff --cached --quiet || { git commit -m "probe: échantillons des sources v3"; git pull --rebase -q; git push; }
