name: Snapshot quotidien

on:
  # GitHub peut retarder ou sauter une tâche planifiée quand ses serveurs sont chargés :
  # trois créneaux par jour, le premier qui passe fait le relevé, les suivants s'arrêtent tout de suite.
  schedule:
    - cron: "17 5 * * *"     # 05:17 UTC (06:17 en hiver, 07:17 en été, heure de Paris)
    - cron: "47 9 * * *"     # rattrapage
    - cron: "23 15 * * *"    # rattrapage
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

concurrency:
  group: daily-snapshot       # jamais deux runs en même temps
  cancel-in-progress: false

env:
  # à surcharger avec la variable de repo SITE_URL si tu passes sur un nom de domaine
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/deal-hunter/', github.repository_owner) }}

jobs:
  # Faut-il faire le relevé ? Toujours pour un lancement manuel ; pour un créneau planifié,
  # seulement si aucun relevé n'a encore été fait aujourd'hui (date UTC).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github     # on n'a besoin que de la liste des dossiers, pas des données
      - id: decide
        run: |
          today=$(date -u +%Y-%m-%d)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Lancement manuel : relevé."; echo "run=true" >> "$GITHUB_OUTPUT"
          elif git ls-tree -d --name-only HEAD "data/raw/deals/$today" | grep -q .; then
            echo "Relevé du $today déjà fait : rien à faire sur ce créneau."; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Pas encore de relevé le $today : on y va."; echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  snapshot:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write         # committer les nouveaux snapshots
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Noter l'heure de départ (pour la page Santé)
        run: echo "RUN_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      # ---------- collecte ----------
      - name: Snapshot CheapShark (toutes les pages)
        env:
          DEALHUNTER_CONTACT: ${{ secrets.DEALHUNTER_CONTACT }}
        run: python src/ingestion/snapshot.py --max-pages 0

      - name: Taux dollar -> euro du jour (BCE)
        continue-on-error: true      # sans réponse de la BCE, on garde le dernier taux connu
        run: python src/ingestion/fx_rate.py

      - name: Plus bas prix historique (CheapShark /games)
        continue-on-error: true      # un raté ici ne doit pas bloquer le site
        env:
          DEALHUNTER_CONTACT: ${{ secrets.DEALHUNTER_CONTACT }}
        run: python src/ingestion/games_info.py

      - name: Fiches Steam (genres, coop, description)
        continue-on-error: true
        env:
          DEALHUNTER_CONTACT: ${{ secrets.DEALHUNTER_CONTACT }}
        run: python src/ingestion/steam_details.py --max-new 400

      - name: Tags joueurs (SteamSpy)
        continue-on-error: true
        env:
          DEALHUNTER_CONTACT: ${{ secrets.DEALHUNTER_CONTACT }}
        run: python src/ingestion/steamspy_tags.py --max-new 500

      - name: Prix Steam en euros
        continue-on-error: true
        env:
          DEALHUNTER_CONTACT: ${{ secrets.DEALHUNTER_CONTACT }}
        run: python src/ingestion/steam_prices.py

      - name: « Le jeu en bref » par IA (Groq, ou autre API compatible OpenAI)
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python src/ml/game_briefs.py --max-new 100

      # ---------- transformation ----------
      - name: Construire le warehouse (chargement + dbt build)
        run: python src/transform/build_warehouse.py

      # ---------- publication ----------
      - name: Exporter les données du site (+ chiffres du marché)
        run: python src/export/export_site_data.py

      - name: Cache du modèle d'IA (téléchargé une seule fois)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small-q8

      - name: Index de recherche IA + jeux similaires
        continue-on-error: true      # sans index, le site marche quand même (recherche classique)
        run: python src/ml/embed_games.py

      - name: Pages par jeu, sitemap, robots.txt
        run: python src/export/build_pages.py

      - name: Documentation dbt (lignage des tables) sur /docs
        continue-on-error: true
        working-directory: dbt
        env:
          DEALHUNTER_DB: ${{ github.workspace }}/data/warehouse/dealhunter.duckdb
        run: |
          dbt docs generate --static --quiet
          mkdir -p ../site/docs
          cp target/static_index.html ../site/docs/index.html

      - name: Lake Parquet (+ Cloudflare R2 si configuré)
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python src/lake/export_lake.py

      - name: Santé du pipeline
        run: python src/export/build_health.py

      - name: Bot Discord (si configuré)
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/export/notify_discord.py

      - name: Committer le snapshot du jour
        run: |
          git config user.name  "dealhunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/ref
          if git diff --cached --quiet; then
            echo "Rien de nouveau à committer"
          else
            git commit -m "data: snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Préparer le site pour GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: snapshot
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
