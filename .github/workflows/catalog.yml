name: Catalogue Steam

# Le catalogue complet des jeux Steam payants (SteamSpy, ~1 h 30 car limité à 1 page par minute)
# puis la correspondance avec IsThereAnyDeal. Une fois par mois suffit : de nouveaux jeux sortent,
# mais leur historique de prix est encore court.
on:
  schedule:
    - cron: "11 2 1 * *"       # le 1er de chaque mois à 02:11 UTC
  workflow_dispatch:

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Catalogue Steam payant (SteamSpy)
        env:
          DEALHUNTER_CONTACT: ${{ secrets.DEALHUNTER_CONTACT }}
        run: python src/ingestion/steam_catalog.py

      - name: Correspondance Steam -> IsThereAnyDeal
        env:
          DEALHUNTER_CONTACT: ${{ secrets.DEALHUNTER_CONTACT }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
        run: python src/ingestion/itad_ids.py

      - name: Committer
        run: |
          git config user.name  "dealhunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ref/catalog data/ref/itad
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "catalogue: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
