name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]   # les commits de données du bot ne relancent pas les tests
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Tests (ingestion, recherche, export, warehouse + dbt)
        run: python -m pytest -v
