name: dealhunter
version: "1.0.0"
config-version: 2
profile: dealhunter

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  dealhunter:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

tests:
  dealhunter:
    +severity: warn          # une anomalie de données prévient, elle ne bloque pas le site
