version: 2

models:
  - name: dim_stores
    description: "Boutiques"
    columns:
      - name: store_id
        tests: [unique, not_null]

  - name: dim_games
    description: "Un jeu = une ligne, enrichi (plus bas historique, fiche Steam, tags, prix en euros)"
    columns:
      - name: game_id
        tests: [unique, not_null]
      - name: lowest_ever_price
        description: "Le plus bas entre l'historique CheapShark et nos propres relevés"
        tests: [not_null]

  - name: fct_price_history
    description: "Un prix par jeu x boutique x jour : la base de la future prédiction de promos"
    columns:
      - name: game_id
        tests: [not_null]

  - name: current_deals
    description: "Deals du dernier snapshot, prêts pour le site"
    columns:
      - name: game_id
        tests: [not_null]
      - name: deal_url
        tests: [not_null]

  - name: insights_store_stats
    description: "Statistiques par boutique pour la page Insights"
    columns:
      - name: store_id
        tests: [unique, not_null]

  - name: fct_game_daily_price
    description: "Meilleur prix du jour d'un jeu toutes boutiques confondues (source CheapShark /games, boutiques sans promo comprises)"
    columns:
      - name: best_price
        tests: [not_null]

  - name: ml_price_drop_features
    description: >
      Données du modèle de prédiction : variables connues le jour J (passé uniquement) et cible will_drop
      (baisse d'au moins drop_threshold dans les drop_horizon_days jours suivants, définie seulement quand ces jours sont passés)
    columns:
      - name: game_id
        tests: [not_null]
      - name: will_drop
        tests:
          - accepted_values:
              values: [0, 1]
              quote: false


  - name: dim_catalog
    description: "v3 — catalogue des jeux Steam payants : prix du jour, historique des promos, réduction attendue de la prochaine promo"
    columns:
      - name: appid
        tests: [unique, not_null]

  - name: fct_steam_sale_episodes
    description: "v3 — une ligne par promo Steam d'un jeu (début, fin, réduction maximale)"
    columns:
      - name: cut
        tests: [not_null]

  - name: dim_steam_major_sales
    description: "v3 — jours de début des grandes soldes Steam : détectées dans les données (passé) ou annoncées (futur)"
    columns:
      - name: start_date
        tests: [unique, not_null]

  - name: ml_next_sale_samples
    description: "v3 — données du modèle « quand aura lieu la prochaine promo ? » (variables du passé uniquement)"
    columns:
      - name: itad_id
        tests: [not_null]
